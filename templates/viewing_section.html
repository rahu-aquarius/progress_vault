<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Viewing Section - Progress Vault</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
            color: #e0e0e0;
            padding: 2rem;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #e0e0e0;
        }

        .btn-logout {
            padding: 0.8rem 1.5rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #d0d0d0;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-logout:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.35);
            color: #ffffff;
        }

        /* Video Grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .video-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.2s;
            cursor: pointer;
        }

        .video-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .video-thumbnail {
            width: 100%;
            height: 180px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 0.9rem;
        }

        .video-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-info {
            padding: 1.2rem;
        }

        .video-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #e0e0e0;
            margin-bottom: 0.5rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .video-meta {
            font-size: 0.85rem;
            color: #888;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #666;
        }

        .empty-state h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: #888;
        }

        .empty-state p {
            font-size: 0.95rem;
            color: #666;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            .btn-logout {
                width: 100%;
                text-align: center;
            }

            .video-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Progress Vault</h1>
        <a href="/logout" class="btn-logout">Logout</a>
    </div>

    {% if videos %}
    <div class="video-grid">
        {% for video in videos %}
        <div class="video-card" onclick="playVideo('{{ video.youtube_url }}')">
            <div class="video-thumbnail">
                {% if video.thumbnail_url %}
                <img src="{{ video.thumbnail_url }}" alt="{{ video.title }}" onerror="this.parentElement.innerHTML='No Thumbnail'">
                {% else %}
                No Thumbnail
                {% endif %}
            </div>
            <div class="video-info">
                <div class="video-title" title="{{ video.title }}">{{ video.title }}</div>
                <div class="video-meta">{{ video.upload_date.strftime('%b %d, %Y') }}</div>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <div class="empty-state">
        <h3>No videos available</h3>
        <p>Check back later for new content</p>
    </div>
    {% endif %}

    <script>
        // CRITICAL: Verify authentication on page load
        async function verifyAuth() {
            try {
                const response = await fetch('/api/verify-auth', {
                    credentials: 'include'
                });

                if (response.status === 401 || !response.ok) {
                    console.log('Not authenticated, redirecting to login');
                    window.location.replace('/');
                    return false;
                }

                const data = await response.json();
                if (!data.authenticated) {
                    window.location.replace('/');
                    return false;
                }

                return true;
            } catch (error) {
                console.error('Auth verification failed:', error);
                window.location.replace('/');
                return false;
            }
        }

        // Run auth check immediately
        verifyAuth();

        // Auto-logout timer - checks every 2 seconds
let autoLogoutTimer;

function startAutoLogoutCheck() {
    if (autoLogoutTimer) {
        clearInterval(autoLogoutTimer);
    }

    autoLogoutTimer = setInterval(async () => {
        try {
            const response = await fetch('/api/check-session', {
                credentials: 'include'
            });

            if (response.status === 401 || !response.ok) {
                console.log('Session expired - logging out');
                clearInterval(autoLogoutTimer);
                alert('Your session has expired. Please login again.');
                window.location.replace('/logout');
            } else {
                const data = await response.json();
                if (!data.valid) {
                    console.log('Session invalid - logging out');
                    clearInterval(autoLogoutTimer);
                    alert('Your session has expired. Please login again.');
                    window.location.replace('/logout');
                }
                console.log(`Session expires in ${data.expires_in} seconds`);
            }
        } catch (error) {
            console.error('Session check failed:', error);
            clearInterval(autoLogoutTimer);
            window.location.replace('/logout');
        }
    }, 2000);
}

startAutoLogoutCheck();


        // Prevent back button - show logout confirmation
        window.history.pushState(null, '', window.location.href);

        window.addEventListener('popstate', function() {
            window.history.pushState(null, '', window.location.href);

            // Show confirmation popup
            if (confirm('Are you sure you want to log out?')) {
                // User confirmed - logout
                window.location.href = '/logout';
            }
            // If user cancels, stay on page
        });

        // Prevent caching - verify auth if page loaded from cache
        window.onpageshow = function(event) {
            if (event.persisted) {
                verifyAuth().then(isValid => {
                    if (!isValid) {
                        window.location.replace('/');
                    }
                });
            }
        };

        // Play video in new tab
        function playVideo(url) {
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
