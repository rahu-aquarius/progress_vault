<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Viewing Section - Progress Vault</title>
    <link rel="stylesheet" href="/static/css/viewing_section.css">
</head>
<body>
    <div class="header">
        <h1>Progress Vault</h1>
        <a href="/logout" class="btn-logout">Logout</a>
    </div>

    {% if videos %}
    <div class="video-grid">
        {% for video in videos %}
        <div class="video-card" onclick="playVideo('{{ video.youtube_url }}')">
            <div class="video-thumbnail">
                {% if video.thumbnail_url %}
                <img src="{{ video.thumbnail_url }}" alt="{{ video.title }}" onerror="this.parentElement.innerHTML='No Thumbnail'">
                {% else %}
                No Thumbnail
                {% endif %}
            </div>
            <div class="video-info">
                <div class="video-title" title="{{ video.title }}">{{ video.title }}</div>
                <div class="video-meta">{{ video.upload_date.strftime('%b %d, %Y') }}</div>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <div class="empty-state">
        <h3>No videos available</h3>
        <p>Check back later for new content</p>
    </div>
    {% endif %}

    <script src="/static/js/viewing_section.js"></script>
</body>
</html>
