<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Vault</title>
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <div id="bg-layer"></div>
    <div id="dim-layer"></div>

    <div class="screen-container" id="centerContainer">
        <div class="clock-container">
            <div class="date" id="dateDisplay">Loading...</div>
            <div class="time" id="timeDisplay">00:00</div>
        </div>
        <div id="screen-landing">
            <div class="question">Are you Samip?</div>
            <div class="btn-group">
                <button class="mac-btn" onclick="showAdmin()">YES</button>
                <button class="mac-btn" onclick="showGuest()">NO</button>
            </div>
        </div>

        <div id="screen-admin" class="auth-screen">
            <div class="question">Enter Admin Password</div>
            <form onsubmit="loginAdmin(event)">
                <input type="password" id="adminPass" class="admin-input" placeholder="Password" autofocus>
            </form>
            <div class="timer-display" id="timerAdmin" style="margin-top: 2rem;">60s</div>
            <div class="back-btn" onclick="goBack()" style="margin-top: 1.5rem;">Cancel</div>
        </div>
    </div>

    <div class="guest-container" id="guestContainer">
        <div class="clock-container">
            <div class="date" id="dateDisplay2">Loading...</div>
            <div class="time" id="timeDisplay2">00:00</div>
        </div>

        <div class="password-boxes" id="passwordBoxes"></div>

        <div id="hologram-keyboard">
            <div class="holo-row">
                <div class="holo-key" data-key="0" onclick="typeKey('0')">0</div>
                <div class="holo-key" data-key="1" onclick="typeKey('1')">1</div>
                <div class="holo-key" data-key="2" onclick="typeKey('2')">2</div>
                <div class="holo-key" data-key="3" onclick="typeKey('3')">3</div>
                <div class="holo-key" data-key="4" onclick="typeKey('4')">4</div>
                <div class="holo-key" data-key="5" onclick="typeKey('5')">5</div>
                <div class="holo-key" data-key="6" onclick="typeKey('6')">6</div>
                <div class="holo-key" data-key="7" onclick="typeKey('7')">7</div>
                <div class="holo-key" data-key="8" onclick="typeKey('8')">8</div>
                <div class="holo-key" data-key="9" onclick="typeKey('9')">9</div>
            </div>
            <div class="holo-row">
                <div class="holo-key" data-key="s" onclick="typeKey('S')">S</div>
                <div class="holo-key" data-key="a" onclick="typeKey('A')">A</div>
                <div class="holo-key" data-key="m" onclick="typeKey('M')">M</div>
                <div class="holo-key" data-key="i" onclick="typeKey('I')">I</div>
                <div class="holo-key" data-key="p" onclick="typeKey('P')">P</div>
                <div class="holo-key" data-key="-" onclick="typeKey('-')">-</div>
                <div class="holo-key" data-key="a" onclick="typeKey('A')">A</div>
                <div class="holo-key" data-key="r" onclick="typeKey('R')">R</div>
                <div class="holo-key" data-key="y" onclick="typeKey('Y')">Y</div>
                <div class="holo-key" data-key="a" onclick="typeKey('A')">A</div>
                <div class="holo-key" data-key="l" onclick="typeKey('L')">L</div>
            </div>
            <div class="holo-row">
                <div class="holo-key" data-key="." onclick="typeKey('.')">.</div>
                <div class="holo-key functional" data-key="Backspace" onclick="backspace()">DELETE</div>
                <div class="holo-key functional" data-key="Enter" onclick="submitGuest()">ENTER</div>
                <div class="holo-key spacebar" onclick="typeKey(' ')">SPACE</div>
            </div>
        </div>

        <div class="footer-controls">
            <div class="timer-display" id="timerGuest">60s remaining</div>
            <div class="back-btn" onclick="goBack()">Cancel</div>
        </div>
    </div>

    <script src="/static/js/login.js"></script>
</body>
</html>
