<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Processing...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            opacity: 0;
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .loader {
            width: 60px;
            height: 60px;
            margin: 0 auto 2rem;
            position: relative;
        }

        .loader-circle {
            width: 100%;
            height: 100%;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .message {
            font-size: 1.5rem;
            font-weight: 500;
            color: #d0d0d0;
            margin-bottom: 1rem;
            letter-spacing: -0.01em;
        }

        .loading-dots {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .loading-dots span {
            animation: blink 1.4s infinite;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 80%, 100% {
                opacity: 0.2;
            }
            40% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader">
            <div class="loader-circle"></div>
        </div>
        <div class="message">Trying to login</div>
        <div class="loading-dots">
            <span>.</span><span>.</span><span>.</span>
        </div>
    </div>

    <script>
        // Prevent back button from getting stuck here
        window.history.replaceState(null, '', window.location.href);

        // Detect if arrived via back button
        let navigationEntries = performance.getEntriesByType('navigation');
        let navigationType = navigationEntries.length > 0 ? navigationEntries[0].type : '';

        if (navigationType === 'back_forward') {
            // User pressed back button - redirect to home
            console.log('Back button detected, redirecting to home');
            window.location.replace('/');
        } else {
            // Normal access - proceed with authentication check
            setTimeout(async () => {
                try {
                    const response = await fetch('/api/check-guest-access');
                    const data = await response.json();

                    if (data.allowed) {
                        // Use replace to prevent back button issues
                        window.location.replace('/viewing');
                    } else {
                        window.location.replace('/failed-login');
                    }
                } catch (error) {
                    console.error('Error checking access:', error);
                    window.location.replace('/failed-login');
                }
            }, 3000);
        }

        // Additional protection: prevent caching
        window.onpageshow = function(event) {
            if (event.persisted) {
                window.location.replace('/');
            }
        };
    </script>
</body>
</html>
